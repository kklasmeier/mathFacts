{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<section class="card">
  <h1>Welcome, {{ current_account['display_name'] or current_account['username'] }}</h1>
  <p class="muted">Make a worksheet, or add and manage the children it is for. Progress will show here later.</p>
  <div class="actions">
    <a class="button" href="{{ url_for('sheets.new_sheet') }}">New sheet</a>
    <a class="button secondary" href="{{ url_for('children.index') }}">Children</a>
  </div>
</section>
{% endblock %}
